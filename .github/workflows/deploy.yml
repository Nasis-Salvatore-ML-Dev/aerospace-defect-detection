name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: git SHA)"
        required: false
        default: ""

# Prevent concurrent deployments — if a new push arrives while a
# deployment is in progress, cancel the in-progress run.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: aerospace-defect-detection
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: aerospace-defect-detection
  IMAGE_NAME: api

jobs:
  # --------------------------------------------------------------------
  # Job 1: Build and push Docker image to Artifact Registry
  # --------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          docker build \
            --tag "${IMAGE_URI}" \
            --label "git-sha=${{ github.sha }}" \
            --label "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest" \
            .

          docker push "${IMAGE_URI}"

          # Also tag as latest for cache reuse on next build
          docker tag "${IMAGE_URI}" \
            "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          docker push \
            "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"

          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "Built and pushed: ${IMAGE_URI}"

      - name: Smoke test image locally
        run: |
          IMAGE_URI="${{ steps.build.outputs.image_uri }}"

          # Run the container in the background
          docker run -d \
            --name smoke-test \
            --publish 8080:8080 \
            --env PORT=8080 \
            "${IMAGE_URI}"

          # Wait for the container to start
          sleep 10

          # Hit the health endpoint
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://localhost:8080/health)

          docker stop smoke-test
          docker rm smoke-test

          if [ "${STATUS}" != "200" ]; then
            echo "Smoke test FAILED — /health returned HTTP ${STATUS}"
            exit 1
          fi
          echo "Smoke test PASSED — /health returned HTTP 200"

  # --------------------------------------------------------------------
  # Job 2: Deploy to Cloud Run
  # --------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.image_uri }}
          flags: |
            --min-instances=0
            --max-instances=3
            --memory=2Gi
            --cpu=1
            --timeout=60s
            --concurrency=8
            --set-env-vars=GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            --set-env-vars=MODEL_VERSION=v1.0
            --set-env-vars=LOG_LEVEL=INFO
            --allow-unauthenticated

      - name: Verify deployment — health check
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Service URL: ${SERVICE_URL}"

          # Retry up to 5 times (Cloud Run may take a moment to warm up)
          for i in {1..5}; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "${SERVICE_URL}/health")
            if [ "${STATUS}" = "200" ]; then
              echo "Health check PASSED (attempt ${i}) — HTTP 200"
              break
            fi
            echo "Attempt ${i}: HTTP ${STATUS} — retrying in 5s..."
            sleep 5
            if [ "${i}" = "5" ]; then
              echo "Health check FAILED after 5 attempts"
              exit 1
            fi
          done

      - name: Print deployment summary
        run: |
          echo "================================================"
          echo "Deployment complete"
          echo "Service:   ${{ env.SERVICE_NAME }}"
          echo "Region:    ${{ env.REGION }}"
          echo "Image:     ${{ needs.build-and-push.outputs.image_uri }}"
          echo "URL:       ${{ steps.deploy.outputs.url }}"
          echo "SHA:       ${{ github.sha }}"
          echo "================================================"

      - name: Output service URL to job summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`${{ env.SERVICE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ needs.build-and-push.outputs.image_uri }}\` |" >> $GITHUB_STEP_SUMMARY
